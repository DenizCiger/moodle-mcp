[package]
name = "moodle-mcp"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
futures = "0.3.34"
html2md = "0.2.17"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "fs"] }
zip = "9.6.0"
